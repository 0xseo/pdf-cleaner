[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-cleaner-local-engine"
version = "0.1.0"
description = "Local-only PDF handwriting review and cleaning engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pikepdf>=9,<11",
  "Pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<5",
  "python-multipart>=0.0.20,<1",
  "pytesseract>=0.3.13,<1",
  "reportlab>=4.3,<5",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["services/local-engine"]
testpaths = ["services/local-engine/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
